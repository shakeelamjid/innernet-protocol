<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terms · INNERnet providers</title>
  <link rel="stylesheet" href="static/registry.css">
  <script src="static/terms.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap"><a class="logo" href="/"><img src="static/logo-white.svg" alt="INNERnet" width="104" height="16"><span>Providers</span></a></div></header>
  <main>
    <div class="wrap narrow">
      <div class="head"><div>
        <h1>Terms</h1>
        <p>Providers agree to the provider terms when they set up a machine; clients agree to the client terms with every payment. Each version is identified by the fingerprint shown, which is signed into listings and payments.</p>
      </div></div>
      <p class="msg error" id="err" hidden></p>
      <section class="card frame step terms" id="provider"><p class="fp" id="provider-fp"></p><div id="provider-text"></div></section>
      <section class="card frame step terms" id="client"><p class="fp" id="client-fp"></p><div id="client-text"></div></section>
    </div>
  </main>
</body>
</html>
