<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Open a sealed file · INNERNET</title>
  <link rel="icon" href="../../static/favicon.svg?v=066" type="image/svg+xml">
  <link rel="stylesheet" href="../../static/registry.css">
  <script src="../../static/send-core.js" defer></script>
  <script src="../../static/send-store.js" defer></script>
  <script src="../../static/send-open.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/"><img src="../../static/logo-white.svg?v=066" alt="INNERNET" width="90" height="20"><span>Send</span></a>
      <span class="spacer"></span>
      <a class="btn btn-sm" href="../../send">Send a file</a>
    </div>
  </header>
  <main>
    <div class="wrap narrow">
      <div class="head"><div>
        <h1 id="title">A sealed file for you</h1>
        <p id="lede">Checking the link…</p>
      </div></div>

      <section class="card frame step" id="ask" hidden>
        <h2 id="from"></h2>
        <p id="note" hidden></p>
        <p class="note" id="rules"></p>
        <form id="form" novalidate>
          <label class="label" for="pin">PIN from the sender</label>
          <input id="pin" class="field code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
          <div class="actions"><button class="btn btn-light" id="go" type="submit">Open</button></div>
        </form>
        <p class="msg" id="msg" role="status"></p>
      </section>

      <section class="card frame step" id="got" hidden>
        <h2 id="name"></h2>
        <p id="facts"></p>
        <div class="actions"><a class="btn" id="save" download>Save the file</a></div>
        <p class="note" id="after"></p>
      </section>
    </div>
  </main>
</body>
</html>
