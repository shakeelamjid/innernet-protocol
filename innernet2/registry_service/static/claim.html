<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connect your machine · INNERnet providers</title>
  <link rel="stylesheet" href="static/registry.css">
  <script src="static/passkey.js" defer></script>
  <script src="static/claim.js" defer></script>
</head>
<body>
  <header class="top"><div class="wrap"><a class="logo" href="/"><img src="static/logo-white.svg" alt="INNERnet" width="104" height="16"><span>Providers</span></a></div></header>
  <section class="center">
    <div class="panel frame">
      <h1>Connect your machine</h1>
      <p>Enter the code your terminal shows. Then add a passkey so you can manage this machine from any device. If this device already has one for this machine, you just confirm it.</p>
      <label for="code">Code from your terminal</label>
      <input id="code" class="code-input" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX">
      <label for="pk-name">Name for this passkey</label>
      <input id="pk-name" maxlength="40" autocomplete="off" placeholder="e.g. Laptop, Phone">
      <button class="btn btn-light" id="go">Continue</button>
      <p class="msg" id="msg" role="status"></p>
      <p class="note">Do not have a code? On the machine, run <code>innernet-provider start</code>.</p>
    </div>
  </section>
</body>
</html>
