# Read-only public HTTP gateway; TLS is provided by Coolify reverse proxy.
# NEVER proxy public PUT/POST/PATCH/DELETE into the experimental node service.
limit_req_zone $binary_remote_addr zone=inn_reads:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=inn_conn:10m;
server {
    listen 8080;
    server_name _;
    server_tokens off;
    default_type text/plain;
    client_max_body_size 1024;
    # Deny writes on every public path before request routing.
    if ($request_method !~ "^(GET|HEAD)$") { return 405; }
    access_log off;
    location = / {
        limit_except GET { deny all; }
        return 200 "INNERnet research node online. Public ciphertext read-only gateway.\n";
    }
    location = /.well-known/innernet-node {
        limit_except GET { deny all; }
        proxy_pass http://node:9400;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /v2/offer {
        limit_except GET { deny all; }
        proxy_pass http://node:9400;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location ~ "^/v2/(fragments|records)/[0-9a-f]{64}$" {
        limit_except GET { deny all; }
        limit_req zone=inn_reads burst=30 nodelay;
        limit_conn inn_conn 8;
        proxy_pass http://node:9400;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
