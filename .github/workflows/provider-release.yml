name: provider-release

on:
  push:
    tags: ["provider-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Test
        working-directory: provider
        run: go test ./...
      - name: Build all systems
        working-directory: provider
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#provider-v}"
          mkdir -p "$RUNNER_TEMP/dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$RUNNER_TEMP/dist/innernet-provider-$os-$arch$ext" .
          done
          cp install.sh install.ps1 "$RUNNER_TEMP/dist/"
          cd "$RUNNER_TEMP/dist" && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/provider-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* \
            --title "innernet-provider ${GITHUB_REF_NAME#provider-v}" \
            --notes "IRM-1 draft provider CLI (testnet). Verify downloads against SHA256SUMS." \
            --prerelease
