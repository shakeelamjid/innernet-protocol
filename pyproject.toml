[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "innernet-protocol-research"
version = "1.0.0"
description = "INNERnet authenticated transport and encrypted object recovery protocol"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "webauthn>=2.5,<3"]
registry = ["webauthn>=2.5,<3"]
contracts = ["web3>=7", "eth-tester[py-evm]>=0.12"]

[project.scripts]
innernet = "innernet2.cli:main"
innernet-mailbox = "innernet2.mailbox:main"
innernet-transit = "innernet2.transit_v100:main"
innernet-st80-node = "innernet2.node_cli_v100:main"
innernet-qualify = "innernet2.qualify_v110:main"
innernet-uv10 = "innernet2.universal_v1:main"
innernet-universal = "innernet2.universal_transport_v1:main"
innernet-qualify-v1 = "innernet2.qualify_v1:main"

[tool.setuptools]
packages = ["innernet2", "innernet2.registry_service"]

[tool.setuptools.package-data]
"innernet2.registry_service" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
