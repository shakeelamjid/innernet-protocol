# INNERnet Coolify v0.2 pilot: PUBLIC READ-ONLY GATEWAY, PRIVATE WRITABLE NODE.
# Do not publish the 'node' service as a Coolify domain or publish its host port.
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      INN_NODE_ID: ${INN_NODE_ID:-node-contabo-01}
      INN_PUBLIC_URL: ${INN_PUBLIC_URL:?Set_INN_PUBLIC_URL_in_Coolify}
      INN_CAPACITY_BYTES: ${INN_CAPACITY_BYTES:-268435456}
      INN_NODE_DATA: /var/lib/innernet/node
    volumes:
      - innernet_node_data:/var/lib/innernet
    expose:
      - "9400"
    # Research-only upload connection, bound on the server's loopback interface.
    # Reach from Mac via SSH -L; never bind this port to 0.0.0.0.
    ports:
      - "127.0.0.1:${INN_PRIVATE_HOST_PORT:-19400}:9400"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/.well-known/innernet-node', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.gateway
    depends_on:
      node:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  innernet_node_data:
